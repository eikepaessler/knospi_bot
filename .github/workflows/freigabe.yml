name: Knospi Freigabe

# Läuft, wenn du unter einem Entwurf-Issue kommentierst ("ok" = freigeben, "nein" = verwerfen).
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: knospi-post
  cancel-in-progress: false

jobs:
  antwort:
    # Nur Kommentare von dir (Besitzer/Mitglied/Mitarbeiter), nur unter Issues, nicht von Bots
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.issue.body, 'knospi-draft:') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Antwort verarbeiten
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python knospi_bot.py --handle-reply
