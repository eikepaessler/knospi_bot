name: Knospi Instagram Bot

on:
  schedule:
    # Alle 15 Minuten. GitHub garantiert den Zeitpunkt nicht exakt,
    # bei viel Last im Netzwerk kann es ein paar Minuten Verzug geben.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur rendern, nicht wirklich posten"
        type: boolean
        default: false
      make_draft:
        description: "Sofort einen neuen Pool-Entwurf zur Freigabe erstellen (zum Ausprobieren)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# Verhindert, dass zwei Läufe gleichzeitig starten (z. B. GitHub-Cron und
# externer Trigger) und dadurch doppelt posten oder sich beim Speichern in die Quere kommen.
concurrency:
  group: knospi-post
  cancel-in-progress: false

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Bot ausführen
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.make_draft }}" = "true" ]; then ARGS="$ARGS --make-draft"; fi
          python knospi_bot.py $ARGS
